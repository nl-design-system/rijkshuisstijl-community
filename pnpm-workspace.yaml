packages:
  - "apps/**"
  - "packages/*"
  - "packages/components-css/*"
  - "packages/components-react/*"
  - "proprietary/*"

allowBuilds:
  "@parcel/watcher": true
  core-js: false
  esbuild: true
  fsevents: true
  lmdb: true
  msgpackr-extract: true
  msw: true
  sharp: true
  unrs-resolver: true

# Configure pnpm so peer dependencies are automatically installed.
autoInstallPeers: true

# Configure pnpm so that it will not install any package that claims to not be compatible with the current Node.js
# version.
engineStrict: true

# Configure pnpm so it only installs package versions that have been published on the npm registry for at least 24 hours
# (1440 minutes). This helps mitigate the risk of supply chain attacks by avoiding newly published, potentially
# malicious versions. Keep this in sync with npm-check-updates's `cooldown` configuration.
minimumReleaseAge: 1440

# Make an exception for trusted packages, notably our own
minimumReleaseAgeExclude:
  - "@amsterdam/*"
  - "@gemeente-denhaag/*"
  - "@gemeente-rotterdam/*"
  - "@nl-design-system/*"
  - "@nl-design-system-candidate/*"
  - "@nl-design-system-community/*"
  - "@nl-design-system-unstable/*"
  - "@nl-rvo/*"
  - "@rijkshuisstijl-community/*"
  - "@utrecht/*"
  - "@next/*"
  - "next"
  - minimatch@3.1.3 || 3.1.4
  - locutus@2.0.40 || 3.0.25
  - esbuild@0.28.1
  - vite@7.3.5
  - markdown-it@14.1.2
  - http-proxy-middleware@3.0.6 || 3.0.7
  - piscina@5.1.5
  - undici@6.28.0 || 7.28.0 || 7.29.0
  - js-yaml@3.15.1 || 3.15.2 || 4.1.2 || 4.3.0 || 4.3.1 || 4.3.2
  - sigstore@4.1.1
  - '@angular/common@21.2.17 || 21.2.19 || 21.2.20'
  - '@angular/compiler@21.2.17 || 21.2.19 || 21.2.20'
  - '@babel/core@7.29.1'
  - '@angular/core@21.2.17 || 21.2.19 || 21.2.20'
  - brace-expansion@1.1.16 || 1.1.17 || 1.1.18 || 2.1.2 || 2.1.3 || 2.1.4 || 5.0.8 || 5.0.9
  - webpack-dev-server@5.2.6
  - body-parser@1.20.6
  - linkify-it@5.0.2
  - fast-uri@4.1.1 || 4.1.2 || 4.1.3
  - sharp@0.35.0 || 0.35.4
  - style-dictionary@5.4.4
  - postcss@8.5.18 || 8.5.23
  - ip-address@10.2.1 || 10.2.2 || 10.3.1
  - hono@4.12.34 || 4.13.5
  - image-size@2.0.3
  - nanoid@3.3.16 || 3.3.18
  - '@hono/node-server@2.0.10'
  - svgo@4.0.2 || 4.1.0
  - tar@7.5.21
  - pacote@21.5.1
  - browserslist@4.28.7
  - qs@6.15.4 || 6.16.0
  - joi@18.2.4 || 18.2.5
  - colord@2.9.4
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11'
  - baseline-browser-mapping@2.11.0
  - smol-toml@1.7.1

# Configure pnpm to save exact version numbers (not including ^ or ~) in package.json. Lock dependencies to specific
# versions to ensure reproducible installs and prevent automatic upgrades to newer minor or patch releases.
saveExact: true
savePrefix: ""

auditConfig:
  ignoreGhsas:
    - GHSA-vh9h-29pq-r5m8

overrides:
  "@babel/runtime@<7.26.10": ">=7.26.10"
  "@hono/node-server@<1.19.13": ">=1.19.13"
  "@isaacs/brace-expansion@<=5.0.0": ">=5.0.6"
  "@tootallnate/once@<2.0.1": ">=2.0.1"
  ajv@>=7.0.0-alpha.0 <8.18.0: ">=8.18.0"
  axios@<1.15.0: ">=1.15.0"
  brace-expansion@>=5.0.0 <5.0.6: ">=5.0.6"
  braces@<3.0.3: ">=3.0.3"
  cross-spawn@<6.0.6: ">=6.0.6"
  defu@<6.1.5: ">=6.1.5"
  fast-uri@<3.1.2: ">=3.1.2"
  flatted@<3.4.2: ">=3.4.2"
  handlebars@>=4.0.0 <4.7.9: ">=4.7.9"
  hono@<4.12.21: ">=4.12.21"
  ip-address@<=10.1.0: ">=10.1.1"
  locutus: "2.0.39"
  lodash@>=4.0.0 <=4.17.22: ">=4.17.23"
  micromatch@<4.0.8: ">=4.0.8"
  postcss@<8.5.10: ">=8.5.10"
  prismjs@<1.30.0: ">=1.30.0"
  qs@>=6.7.0 <=6.15.1: ">=6.15.2"
  shell-quote@>=1.1.0 <=1.8.3: ">=1.8.4"
  svgo@<2.8.1: ">=2.8.1"
  tar@<7.5.11: ">=7.5.11"
  uuid@<11.1.1: ">=11.1.1"
  webpack-dev-server@<=5.2.3: ">=5.2.4"
  ws@>=8.0.0 <8.20.1: ">=8.20.1"

# Configure pnpm to not fail when there are missing or invalid peer dependencies in the tree.
strictPeerDependencies: false

provenance: true
